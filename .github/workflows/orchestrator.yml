name: Bryson Clips Animation Orchestrator

on:
  schedule:
    # Runs 4x daily: 06:00, 12:00, 18:00, 00:00 UTC
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config.yaml'
      - 'orchestrator.py'
      - 'agents/**'
      - 'evolution/**'

env:
  PYTHON_VERSION: '3.11'

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml schedule requests

      - name: Create directories
        run: mkdir -p logs state auth assets output

      - name: Run single cycle (real API mode)
        env:
          USE_FALLBACK: "true"
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_cycle_ci.py

      - name: Upload state DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-db
          path: state/videos.db
          retention-days: 7
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-logs
          path: logs/
          retention-days: 3
