name: Bryson Clips Animation Orchestrator

on:
  schedule:
    # Runs 4x daily: 06:00, 12:00, 18:00, 00:00 UTC
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'config.yaml'
      - 'orchestrator.py'
      - 'agents/**'
      - 'evolution/**'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libglib2.0-0 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: playwright install chromium
      
      - name: Restore auth states
        uses: actions/cache@v4
        with:
          path: auth/
          key: auth-states-${{ github.sha }}
          restore-keys: |
            auth-states-
      
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: state/
          key: db-state-${{ github.sha }}
          restore-keys: |
            db-state-
      
      - name: Create directories
        run: |
          mkdir -p logs output assets state auth
      
      - name: Run Orchestrator
        env:
          # Add any API keys as GitHub Secrets
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        run: |
          python orchestrator.py --single-cycle
      
      - name: Save database state
        uses: actions/cache@v4
        if: always()
        with:
          path: state/
          key: db-state-${{ github.sha }}
      
      - name: Save auth states
        uses: actions/cache@v4
        if: always()
        with:
          path: auth/
          key: auth-states-${{ github.sha }}
      
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-logs
          path: logs/
          retention-days: 7
      
      - name: Upload output videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/
          retention-days: 3

  # Daily optimization job (runs once per day at 23:50 UTC)
  daily-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: run-orchestrator
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            state/
            auth/
          key: db-state-${{ github.sha }}
      
      - name: Run Daily Optimization
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
import asyncio
from orchestrator import Orchestrator
orch = Orchestrator()
asyncio.run(orch.run_daily_optimization())
"
      
      - name: Save updated state
        uses: actions/cache@v4
        if: always()
        with:
          path: state/
          key: db-state-${{ github.sha }}